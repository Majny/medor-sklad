<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Správa skladu</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
    <h1>Správa skladu</h1>
</header>

<div class="layout">
    <aside class="filter" aria-label="Filtr gridu">
        <div class="filter-head">
            <h2>Filtr</h2>
            <button type="button" id="reset-filter" class="link">Zrušit filtr</button>
        </div>
        <p class="hint">Nic nevybráno = zobrazit vše.</p>

        <fieldset class="filter-group" data-key="clientIds">
            <legend>Klienti <span class="count"></span></legend>
            <div class="options" id="clients"></div>
        </fieldset>

        <fieldset class="filter-group" data-key="categoryIds">
            <legend>Kategorie <span class="count"></span></legend>
            <div class="options" id="categories"></div>
        </fieldset>

        <fieldset class="filter-group" data-key="productIds">
            <legend>Produkty <span class="count"></span></legend>
            <input type="search" id="product-search" placeholder="Hledat produkt…" aria-label="Hledat produkt">
            <div class="options" id="products"></div>
        </fieldset>
    </aside>

    <main class="content">
        <div class="toolbar">
            <span id="row-count"></span>
            <span class="messages">
                <span id="status" role="status" aria-live="polite"></span>
                <span id="error" role="alert"></span>
            </span>
        </div>
        <table class="grid">
            <thead>
            <tr>
                <th>Klient</th>
                <th>Kategorie produktu</th>
                <th>Produkt</th>
                <th class="num">Počet kusů</th>
            </tr>
            </thead>
            <tbody id="grid-body"></tbody>
        </table>
    </main>
</div>

<script src="app.js"></script>
</body>
</html>
